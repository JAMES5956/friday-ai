name: FRIDAY AI checks

concurrency:
  group: friday-ai-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - "foundation/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Install, lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Report dependency vulnerabilities
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); const v=a.vulnerabilities||{}; const rows=Object.entries(v); console.log("Dependency audit:", rows.length, "affected packages"); for (const [name, item] of rows) console.log(JSON.stringify({name, severity:item.severity, range:item.range, direct:item.isDirect, fixAvailable:item.fixAvailable, via:item.via.map(x=>typeof x==="string"?x:{name:x.name,title:x.title,url:x.url,range:x.range})}));'
      - name: Run ESLint
        run: npm run lint
      - name: Run unit tests
        run: npm run test
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build application
        run: npm run build
